name: ru · Представить отдельное исследование
description: Поделитесь самостоятельным исследованием, методами и доказательствами.
title: '[ru v0.3] '
labels:
- needs-review
body:
- type: markdown
  attributes:
    value: Issue, PR и вложения публичны и связаны с вашим аккаунтом GitHub. Код участника не обеспечивает анонимность.
- type: textarea
  id: report
  attributes:
    label: Представить отдельное исследование
    description: Опишите вопрос, набор участников, их число, источник типа личности, задачи и инструменты ИИ, методы,
      результаты, ограничения и разрешения. Отделяйте реальные данные от гипотез.
  validations:
    required: true
