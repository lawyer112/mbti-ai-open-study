name: ko · 설문 제출
description: 내보낸 파일을 첨부하거나 전체 보고서를 붙여 넣으세요.
title: '[ko v0.3] '
labels:
- needs-review
body:
- type: markdown
  attributes:
    value: 'MBTI와 일상적인 AI 사용, 평가, 이야기에 관한 가벼운 조사입니다. 최근 30일을 떠올려 주세요. 성격 검사나 능력 순위가 아닙니다.


      Issue, PR, 첨부 파일은 공개되며 GitHub 계정과 연결됩니다. 참여 코드가 익명성을 보장하지는 않습니다.


      보고서를 검토하고 공개하면 안 되는 정보를 삭제하세요.


      JSON 데이터와 Markdown 보고서를 다운로드하세요.


      GitHub Issue에 파일을 첨부하거나 전체 보고서를 붙여 넣으세요. PR로도 제출할 수 있습니다.


      https://lawyer112.github.io/mbti-ai-open-study/survey/index.html?lang=ko'
- type: input
  id: case-id
  attributes:
    label: 보고서 ID
    description: 본인의 습관·경험·생각을 보고한 자료이며 인용 허가는 A05에 있습니다. 같은 참여의 두 형식은 보고서 ID로 연결합니다.
  validations:
    required: true
- type: input
  id: schema-version
  attributes:
    label: 설문 버전
    description: '0.3'
    value: '0.3'
  validations:
    required: true
- type: dropdown
  id: questionnaire-mode
  attributes:
    label: 설문 형식
    options:
    - 가볍게 선택하기
    - 경험 나누기
    - 가볍게 선택하기 + 경험 나누기
  validations:
    required: true
- type: input
  id: instrument-language
  attributes:
    label: 언어
    value: ko
  validations:
    required: true
- type: textarea
  id: report-files
  attributes:
    label: 파일 또는 전체 보고서
    description: 내보낸 파일을 첨부하거나 전체 보고서를 붙여 넣으세요.
  validations:
    required: true
- type: textarea
  id: amendments
  attributes:
    label: 기존 보고서 및 정정
    description: 본인의 습관·경험·생각을 보고한 자료이며 인용 허가는 A05에 있습니다. 같은 참여의 두 형식은 보고서 ID로 연결합니다.
  validations:
    required: false
- type: checkboxes
  id: confirmation
  attributes:
    label: 참여 확인
    options:
    - label: 저는 만 18세 이상이며 자발적으로 참여합니다. 제 실제 습관, 경험 또는 생각을 작성합니다.
      required: true
    - label: GitHub 제출물이 공개되고 제 계정과 연결됨을 이해합니다. 보고서 ID는 익명성을 보장하지 않습니다.
      required: true
    - label: 사적인 정보와 기밀을 제거했으며 자료를 공유할 권리가 있습니다. 이 프로젝트의 통계와 글의 요약 사용에 동의하며 공개 사본을 완전히 회수하지 못할 수 있음을 이해합니다.
      required: true
