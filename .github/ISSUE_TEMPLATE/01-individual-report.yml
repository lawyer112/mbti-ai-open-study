name: zh-CN · 个人问卷回传
description: 附上导出文件或粘贴完整报告。
title: '[zh-CN v0.3] '
labels:
- needs-review
body:
- type: markdown
  attributes:
    value: '关于 MBTI、日常 AI 使用、评价和故事的趣味调查。请回想最近 30 天；这里不测人格，也不给能力排名。


      Issue、PR 及附件会公开并关联 GitHub 账号；研究代号不等于匿名。


      检查报告，移除不应公开的信息。


      下载 JSON 数据与 Markdown 可读报告。


      在 GitHub Issue 附文件或粘贴完整报告，也可通过 PR 提交。


      https://lawyer112.github.io/mbti-ai-open-study/survey/index.html?lang=zh-CN'
- type: input
  id: case-id
  attributes:
    label: 报告编号
    description: 内容为本人习惯、经历与看法，引用权限见 A05。同一次参与的两版用报告编号关联。
  validations:
    required: true
- type: input
  id: schema-version
  attributes:
    label: 问卷版本
    description: '0.3'
    value: '0.3'
  validations:
    required: true
- type: dropdown
  id: questionnaire-mode
  attributes:
    label: 问卷模式
    options:
    - 轻松点选
    - 分享故事
    - 轻松点选 + 分享故事
  validations:
    required: true
- type: input
  id: instrument-language
  attributes:
    label: 语言
    value: zh-CN
  validations:
    required: true
- type: textarea
  id: report-files
  attributes:
    label: 文件或完整报告
    description: 附上导出文件或粘贴完整报告。
  validations:
    required: true
- type: textarea
  id: amendments
  attributes:
    label: 已有报告与更正
    description: 内容为本人习惯、经历与看法，引用权限见 A05。同一次参与的两版用报告编号关联。
  validations:
    required: false
- type: checkboxes
  id: confirmation
  attributes:
    label: 参与确认
    options:
    - label: 我已满 18 岁，自愿参加；填写的是自己的真实习惯、经历或看法。
      required: true
    - label: 我理解 GitHub 投稿会公开并关联账号；报告编号不代表匿名。
      required: true
    - label: 我已移除私人和机密信息，并有权提交；同意本项目用于统计与文章汇总，理解公开副本不一定能完全收回。
      required: true
