project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - en/index.qmd
    - ja/index.qmd
    - ko/index.qmd
    - es/index.qmd
    - fr/index.qmd
    - de/index.qmd
    - pt/index.qmd
    - ru/index.qmd
    - ar/index.qmd
    - hi/index.qmd
    - id/index.qmd
    - protocol/*/*.qmd
  resources:
    - survey/index.html
    - survey/choice-questionnaire.md
    - survey/text-questionnaire.md
    - survey/*/*-questionnaire.md
    - survey/v0.2/index.html
    - .nojekyll

website:
  title: "MBTI × AI"
  site-url: "https://lawyer112.github.io/mbti-ai-open-study/"
  repo-url: "https://github.com/lawyer112/mbti-ai-open-study"
  navbar: false
  search: false
  open-graph: true

lang: zh-CN
format:
  html:
    theme: cosmo
    css: assets/styles.css
    toc: true
    toc-depth: 3
    page-layout: article
    format-links: false
    smooth-scroll: false
execute:
  enabled: false
