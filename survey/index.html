eative work"}, {"value": "6", "label": "Planning or help with choices"}, {"value": "7", "label": "Talking about emotions or seeking companionship"}, {"value": "8", "label": "Casual chat and entertainment"}, {"value": "9", "label": "Other uses"}]}, {"id": "Q02", "title": "What does AI feel most like to you?", "kind": "radio", "purpose": "Compare the role people give AI without assigning roles to personality types in advance.", "required": true, "hint": "", "show_if": {"id": "A03", "not_equals": "1"}, "options": [{"value": "1", "label": "A tool for getting things done"}, {"value": "2", "label": "A work assistant"}, {"value": "3", "label": "A teacher available for questions"}, {"value": "4", "label": "A discussion partner"}, {"value": "5", "label": "A creative partner"}, {"value": "6", "label": "Someone to chat with or keep me company"}, {"value": "7", "label": "No fixed role yet"}]}], "mode": "choice"}, {"id": "style", "title": "How you like to chat", "intro": "Choose what best matches your habits. There is no correct style.", "items": [{"id": "Q03", "title": "How do you usually start a conversation?", "kind": "radio", "purpose": "Compare expression habits without treating longer prompts as greater ability.", "required": true, "hint": "", "show_if": {"id": "A03", "not_equals": "1"}, "options": [{"value": "1", "label": "A short, direct instruction"}, {"value": "2", "label": "Context, requirements and constraints first"}, {"value": "3", "label": "Break it into steps and ask one by one"}, {"value": "4", "label": "Start talking and work out what I need"}, {"value": "5", "label": "It varies a lot by task"}, {"value": "6", "label": "Cannot recall"}]}, {"id": "Q04", "title": "When the first reply misses the mark, what do you usually do first?", "kind": "radio", "purpose": "Observe the first response to an unsatisfactory answer.", "required": true, "hint": "", "show_if": {"id": "A03", "not_equals": "1"}, "options": [{"value": "1", "label": "Add context or requirements"}, {"va ux.", "items": [{"id": "Q08", "title": "Quel est le principal bénéfice que vous apporte l’IA ?", "kind": "radio", "purpose": "Décrire les bénéfices ressentis sans les présenter comme des gains de performance mesurés.", "required": true, "hint": "", "show_if": {"id": "A03", "not_equals": "1"}, "options": [{"value": "1", "label": "Gagner du temps ou éviter les tâches répétitives"}, {"value": "2", "label": "Comprendre des choses nouvelles"}, {"value": "3", "label": "Trouver des idées ou de l’inspiration"}, {"value": "4", "label": "M’aider à démarrer"}, {"value": "5", "label": "M’aider à exprimer mes pensées"}, {"value": "6", "label": "Discuter ou avoir de la compagnie"}, {"value": "7", "label": "Aucun bénéfice clair pour l’instant"}, {"value": "8", "label": "Un autre bénéfice"}]}, {"id": "Q09", "title": "Qu’est-ce qui vous agace le plus chez l’IA ?", "kind": "multi", "purpose": "Inclure les expériences négatives et les améliorations souhaitées, pas seulement les compliments.", "required": true, "hint": "", "exclusive": ["9"], "show_if": {"id": "A03", "not_equals": "1"}, "options": [{"value": "1", "label": "Se tromper avec assurance"}, {"value": "2", "label": "Passer à côté de ma vraie question"}, {"value": "3", "label": "Être trop longue ou ne pas aller à l’essentiel"}, {"value": "4", "label": "Me donner trop souvent raison"}, {"value": "5", "label": "Oublier les exigences précédentes"}, {"value": "6", "label": "Un style mécanique"}, {"value": "7", "label": "Limites d’usage, coûts ou capacités de l’outil"}, {"value": "8", "label": "La confidentialité ou l’usage des informations"}, {"value": "9", "label": "Aucune critique précise pour le moment"}, {"value": "10", "label": "Autre chose"}]}, {"id": "Q10", "title": "Dans l’ensemble, quelle satisfaction tirez-vous de votre expérience récente avec l’IA ?", "kind": "radio", "purpose": "Décrire la satisfaction, séparément de la confiance, de l’exactitude ou des aptitudes au travail.", "required": true, "hint": "", "show_if": { function answerLabel(q){const v=state.answers[q.id];if(v==null||v===''||(Array.isArray(v)&&!v.length))return null;if(q.options){const ids=Array.isArray(v)?v:[v];return ids.map(id=>q.options.find(o=>o.value===id)?.label||'').join(' / ');}return v;}
function packet(){const qs=available();return {kind:'mbti-ai-response',schema_version:CATALOG.version,response_id:state.case_id,questionnaire_mode:state.mode,record_protocol:'everyday-ai-habits-recent30-v0.3',instrument_language:language,instrument_revision:CATALOG.revision,collection_stage:'pilot',exported_at:new Date().toISOString(),consent:Object.fromEntries(BANK.consents.map((text,i)=>['confirmation_'+(i+1),{text,accepted:state.consents[i],language}])),method:{visited_modes:[...state.visited_modes],purpose_viewed:[...state.purpose_viewed],purpose_exposure:[...state.purpose_exposure],language_history:[...state.language_history],mode_assignment:'participant-choice',record_source:'self-report',measure_validation:'pilot-unvalidated',translation_validation:'AI-assisted-content-check;no-human-validation'},answer_ui_language:Object.fromEntries(qs.filter(q=>answered(q)).map(q=>[q.id,state.answer_ui_language[q.id]||null])),answers:Object.fromEntries(qs.map(q=>[q.id,state.answers[q.id]??null])),answer_labels:Object.fromEntries(qs.map(q=>[q.id,answerLabel(q)])),not_applicable:modeGroups().flatMap(g=>g.items).filter(q=>!active(q)).map(q=>q.id)};}
function markdown(){const p=packet();const lines=[`# ${tr('title')} · ${tr(state.mode)}`,'',`- ${tr('version')}: ${p.schema_version}`,`- ${tr('language')}: ${language}`,`- ${tr('case_label')}: ${state.case_id}`,`- ${tr('exported')}: ${p.exported_at}`,`- ${tr('modeorder')}: ${state.visited_modes.map(m=>tr(m)).join(' → ')}`,`- ${tr('purposeviewed')}: ${state.purpose_viewed.join(', ')||tr('none')}`,'',`## ${tr('consent')}`,...BANK.consents.map((t,i)=>`- [${state.consents[i]?'x':' '}] ${t}`),''];for(const g of groups()){lines.push(`## ${g.title}`,'');for(const q of g.items)lines.push(`### ${q.id} ${q.title}`,'',active(q)?answerLabel(q)||tr('empty'):tr('na'),'');}lines.push('---',tr('reportnote'),'','```json',JSON.stringify({instrument_revision:p.instrument_revision,record_protocol:p.record_protocol,not_applicable:p.not_applicable,method:p.method,answer_ui_language:p.answer_ui_language},null,2),'```');return lines.join('\n');}
function review(){$('preview-text').textContent=markdown();$('review-status').textContent=missing().length||!state.consents.every(Boolean)?tr('missing',{n:missing().length}):tr('ready');$('export-status').textContent='';$('review-dialog').showModal();}
$('review').addEventListener('click',review);$('close-review').addEventListener('click',()=>$('review-dialog').close());
function validate(){const ms=missing();if(!ms.length&&state.consents.every(Boolean))return true;invalid=new Set(ms.map(q=>q.id));$('review-dialog').close();state.step=state.consents.every(Boolean)?groups().findIndex(g=>g.items.some(q=>invalid.has(q.id))):0;render(true);setNotice(tr('missing',{n:ms.length}));const target=state.consents.every(Boolean)?document.querySelector('fieldset.invalid input,fieldset.invalid textarea,fieldset.invalid select'):document.querySelector('[data-consent]:not(:checked)');target?.focus();return false;}
function download(content,name,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
for(const [id,extension,type,content] of [['export-json','json','application/json',()=>JSON.stringify(packet(),null,2)],['export-md','md','text/markdown',markdown]])$(id).addEventListener('click',()=>{if(!validate())return;download(content(),`${state.case_id}-${state.mode}-${language}-v${CATALOG.version}.${extension}`,type+';charset=utf-8');$('export-status').textContent=tr('downloaded');});
$('copy-report').addEventListener('click',async()=>{if(!validate())return;try{if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(markdown());else{const a=document.createElement('textarea');a.value=markdown();$('review-dialog').appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();if(!ok)throw Error();}$('export-status').textContent=tr('copied');}catch{$('export-status').textContent=tr('copy_failed');}});
$('save-draft').addEventListener('click',()=>{download(JSON.stringify(state,null,2),`${state.case_id}-draft-v${CATALOG.version}.json`,'application/json;charset=utf-8');dirty=false;setNotice(tr('saved'));});$('load-draft').addEventListener('click',()=>$('draft-file').click());
$('draft-file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2000000)throw Error();const d=JSON.parse(await f.text());if(d.kind!=='mbti-ai-draft'||d.version!==CATALOG.version||!supported(d.language)||!['choice','text'].includes(d.mode)||!/^case-[a-zA-Z0-9-]{8,80}$/.test(d.case_id))throw Error();if(!d.answers||typeof d.answers!=='object'||Array.isArray(d.answers)||Object.entries(d.answers).some(([id,v])=>!Object.hasOwn(BYID,id)||!validAnswer(BYID[id],v)))throw Error();if(!Array.isArray(d.consents)||d.consents.length!==3||d.consents.some(v=>typeof v!=='boolean'))throw Error();if(!d.answer_ui_language||typeof d.answer_ui_language!=='object'||Object.entries(d.answer_ui_language).some(([id,l])=>!Object.hasOwn(BYID,id)||!supported(l)))throw Error();if(!Array.isArray(d.language_history)||!d.language_history.every(supported)||d.language_history.length>1000)throw Error();if(!Array.isArray(d.purpose_exposure)||d.purpose_exposure.some(x=>!x||!Object.hasOwn(BYID,x.id)||!supported(x.language)))throw Error();if(dirty&&!confirm(tr('replace_confirm')))return;const safe=fresh();Object.assign(safe,{case_id:d.case_id,language:d.language,mode:d.mode,step:Number.isInteger(d.step)?d.step:0,answers:d.answers,answer_ui_language:d.answer_ui_language,consents:d.consents,visited_modes:Array.isArray(d.visited_modes)?d.visited_modes.filter(v=>['choice','text'].includes(v)).slice(0,100):[d.mode],language_history:d.language_history,purpose_viewed:Array.isArray(d.purpose_viewed)?d.purpose_viewed.filter(v=>Object.hasOwn(BYID,v)):[],purpose_exposure:d.purpose_exposure,show_purposes:d.show_purposes===true});state=safe;language=d.language;BANK=CATALOG.banks[language];UI=BANK.ui;dirty=false;invalid.clear();syncConditional();render(true);setNotice(tr('loaded'));}catch{setNotice(tr('import_failed'));}finally{e.target.value='';}});
$('reset').addEventListener('click',()=>{if(!confirm(tr('reset_confirm')))return;state=fresh();dirty=false;invalid.clear();setNotice('');render(true);});window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});render();
</script></body></html>
